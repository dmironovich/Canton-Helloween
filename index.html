<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Canton Halloween Jump 🎃</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="start-screen">
    <h1>Canton Halloween Jump 🎃</h1>
    <input type="text" id="player-name" placeholder="Enter your name" />

  </div>
  <canvas id="game-canvas" width="400" height="600"></canvas>
  <div id="leaderboard">
    <h2>Leaderboard</h2>
    <ul id="scores"></ul>
  </div>
  <script src="game.js"></script>
</body>
</html>
